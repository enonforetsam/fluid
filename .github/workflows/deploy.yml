# Build the reviewed public app and deploy the existing Fluid Worker.
# KrackedDevs deploy framework. Requires secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID.
name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install pinned build dependencies
        run: npm ci
      - name: Build component gallery
        run: npm run build:components
      - name: Build public assets
        run: npm run build:site
      - name: Verify engine, dither and release packaging
        run: npm test
      - name: Deploy to Cloudflare Workers
        run: npx --yes wrangler@4.129.0 deploy --env=""
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
